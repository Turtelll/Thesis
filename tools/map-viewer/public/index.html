<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MVT Layer Viewer — Thesis</title>
    <link rel="stylesheet" href="main.css" />
    <style>
      html, body, #map {
        height: 100%;
        margin: 0;
      }

      #layer-panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 6px;
        padding: 10px 14px;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }

      #layer-panel h1 {
        font-size: 13px;
        margin: 0 0 8px;
        font-weight: 600;
      }

      .layer-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
        cursor: pointer;
      }

      .vertex-toggle {
        padding-left: 18px;
        font-size: 12px;
        color: #555;
      }

      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        display: inline-block;
      }

      .dataset-select {
        width: 100%;
        margin-bottom: 8px;
        font-size: 13px;
      }

      .hover-tooltip {
        pointer-events: none;
      }

      #composition-toggle {
        width: 100%;
        margin-bottom: 8px;
        padding: 4px 8px;
        font-size: 13px;
        cursor: pointer;
        border: 1px solid #adb5bd;
        border-radius: 4px;
        background: #f1f3f5;
      }

      #composition-toggle.active {
        background: #d0ebff;
        border-color: #1971c2;
      }

      /* Composition drawer (src/composition.ts). Sits left of MapLibre's
         navigation control so it never covers it. */
      #composition-drawer {
        position: absolute;
        top: 12px;
        right: 52px;
        bottom: 12px;
        z-index: 2;
        width: min(860px, calc(100vw - 340px));
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 14px;
        overflow-y: auto;
        box-sizing: border-box;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        font-family: system-ui, sans-serif;
        font-size: 12px;
        color: #212529;
      }

      #composition-drawer[hidden] {
        display: none;
      }

      .comp-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .comp-header h2 {
        margin: 0;
        font-size: 15px;
      }

      .comp-icon-button {
        border: none;
        background: none;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        color: #495057;
      }

      .comp-controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .comp-follow {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }

      .comp-button {
        margin-left: auto;
        padding: 2px 10px;
        cursor: pointer;
      }

      .comp-message {
        margin-bottom: 4px;
      }

      .comp-hint {
        color: #6c757d;
        font-size: 11px;
        margin-top: 4px;
      }

      .comp-status progress {
        width: 100%;
      }

      .comp-content {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .comp-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px;
      }

      .comp-card {
        padding: 8px 10px;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        background: #f8f9fa;
      }

      .comp-card-value {
        font-size: 16px;
        font-weight: 600;
      }

      .comp-card-label {
        color: #6c757d;
        font-size: 11px;
      }

      .comp-section h3 {
        margin: 0 0 6px;
        font-size: 13px;
      }

      .comp-typebar {
        margin-bottom: 8px;
      }

      .comp-typebar-label {
        margin-bottom: 2px;
        color: #495057;
      }

      .comp-stack {
        display: flex;
        height: 16px;
        border-radius: 3px;
        overflow: hidden;
        background: #e9ecef;
      }

      .comp-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 3px;
        color: #495057;
      }

      .comp-legend-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .comp-bar-row {
        display: grid;
        grid-template-columns: 130px 1fr 52px;
        align-items: center;
        gap: 8px;
        padding: 1px 0;
      }

      .comp-bar-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .comp-bar-track {
        height: 10px;
        background: #f1f3f5;
        border-radius: 2px;
      }

      .comp-bar-fill {
        height: 100%;
        border-radius: 2px;
      }

      .comp-bar-pct {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .comp-table-wrap {
        overflow-x: auto;
      }

      .comp-table {
        width: 100%;
        border-collapse: collapse;
        white-space: nowrap;
      }

      .comp-table th,
      .comp-table td {
        padding: 3px 8px;
        text-align: left;
        border-bottom: 1px solid #e9ecef;
      }

      .comp-table .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .comp-table th {
        position: sticky;
        top: 0;
        background: #f1f3f5;
        font-weight: 600;
      }

      .comp-table th.sortable {
        cursor: pointer;
        user-select: none;
      }

      .comp-table th.sort-desc::after {
        content: " \25BE";
      }

      .comp-table th.sort-asc::after {
        content: " \25B4";
      }

      .comp-table tr.research td:first-child {
        font-weight: 600;
      }

      .comp-table .swatch-empty {
        background: transparent;
      }

      .comp-table .swatch {
        margin-right: 6px;
      }

      .comp-box {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="layer-panel">
      <h1>Layers</h1>
      <button id="composition-toggle" type="button">Layer composition</button>
    </div>
    <aside id="composition-drawer" hidden></aside>
    <script src="main.js"></script>
  </body>
</html>
