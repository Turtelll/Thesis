<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210" role="img" aria-label="Three lifting shears rotate an integer vector without loss">
  <style>
    .t { fill: #7d8697; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r { fill: #d64545; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm { font-size: 11px; }
    .h { font-weight: 600; }
    .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .s { stroke: #7d8697; }
    .g { stroke: #8b93a1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d6f"/></marker>
  </defs>
  <polygon points="50,116 110,116 110,56 50,56" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="110" cy="116" r="4" fill="#8a63d2"/>
  <text class="t sm" x="80" y="160" text-anchor="middle">integer pair (dx, dy)</text>
  <line x1="132" y1="86" x2="184" y2="86" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#ag)"/>
  <polygon points="218,116 278,116 262,56 202,56" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="278" cy="116" r="4" fill="#8a63d2"/>
  <text class="t sm" x="240" y="160" text-anchor="middle">x₁ = dx − round(tan(a/2)·dy)</text>
  <text class="t sm" x="240" y="176" text-anchor="middle">x changes, y kept</text>
  <line x1="292" y1="86" x2="344" y2="86" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#ag)"/>
  <polygon points="378,127 438,97 422,45 362,75" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="438" cy="97" r="4" fill="#8a63d2"/>
  <text class="t sm" x="400" y="160" text-anchor="middle">y = dy + round(sin(a)·x₁)</text>
  <text class="t sm" x="400" y="176" text-anchor="middle">y changes, x kept</text>
  <line x1="452" y1="86" x2="504" y2="86" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#ag)"/>
  <polygon points="549,127 601,97 571,45 519,75" fill="#3b82c4" fill-opacity="0.15" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="601" cy="97" r="4" fill="#8a63d2"/>
  <text class="t sm" x="560" y="160" text-anchor="middle">x = x₁ − round(tan(a/2)·y)</text>
  <text class="t sm" x="560" y="176" text-anchor="middle">x changes: rotated by a</text>
  <text class="t sm" x="30" y="202">Each step is undone by subtracting the same rounded amount, in reverse order.</text>
</svg>
