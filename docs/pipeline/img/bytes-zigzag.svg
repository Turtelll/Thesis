<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" role="img" aria-label="Zigzag maps signed values to unsigned by magnitude">
  <style>
    .t { fill: #7d8697; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r { fill: #d64545; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm { font-size: 11px; }
    .h { font-weight: 600; }
    .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .s { stroke: #7d8697; }
    .g { stroke: #8b93a1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d6f"/></marker>
  </defs>
  <text class="t" x="20" y="44">signed</text>
  <text class="t" x="20" y="134">zigzag</text>
  <line x1="90" y1="50" x2="440" y2="118" stroke="#d64545" stroke-width="1.5"/>
  <circle cx="90" cy="44" r="5" fill="#d64545"/>
  <circle cx="440" cy="124" r="5" fill="#d64545"/>
  <text class="t m" x="90" y="28" text-anchor="middle">−3</text>
  <text class="t m" x="440" y="150" text-anchor="middle">5</text>
  <line x1="160" y1="50" x2="300" y2="118" stroke="#d64545" stroke-width="1.5"/>
  <circle cx="160" cy="44" r="5" fill="#d64545"/>
  <circle cx="300" cy="124" r="5" fill="#d64545"/>
  <text class="t m" x="160" y="28" text-anchor="middle">−2</text>
  <text class="t m" x="300" y="150" text-anchor="middle">3</text>
  <line x1="230" y1="50" x2="160" y2="118" stroke="#d64545" stroke-width="1.5"/>
  <circle cx="230" cy="44" r="5" fill="#d64545"/>
  <circle cx="160" cy="124" r="5" fill="#d64545"/>
  <text class="t m" x="230" y="28" text-anchor="middle">−1</text>
  <text class="t m" x="160" y="150" text-anchor="middle">1</text>
  <line x1="300" y1="50" x2="90" y2="118" stroke="#8b93a1" stroke-width="1.5"/>
  <circle cx="300" cy="44" r="5" fill="#8b93a1"/>
  <circle cx="90" cy="124" r="5" fill="#8b93a1"/>
  <text class="t m" x="300" y="28" text-anchor="middle">0</text>
  <text class="t m" x="90" y="150" text-anchor="middle">0</text>
  <line x1="370" y1="50" x2="230" y2="118" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="370" cy="44" r="5" fill="#3b82c4"/>
  <circle cx="230" cy="124" r="5" fill="#3b82c4"/>
  <text class="t m" x="370" y="28" text-anchor="middle">1</text>
  <text class="t m" x="230" y="150" text-anchor="middle">2</text>
  <line x1="440" y1="50" x2="370" y2="118" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="440" cy="44" r="5" fill="#3b82c4"/>
  <circle cx="370" cy="124" r="5" fill="#3b82c4"/>
  <text class="t m" x="440" y="28" text-anchor="middle">2</text>
  <text class="t m" x="370" y="150" text-anchor="middle">4</text>
  <line x1="510" y1="50" x2="510" y2="118" stroke="#3b82c4" stroke-width="1.5"/>
  <circle cx="510" cy="44" r="5" fill="#3b82c4"/>
  <circle cx="510" cy="124" r="5" fill="#3b82c4"/>
  <text class="t m" x="510" y="28" text-anchor="middle">3</text>
  <text class="t m" x="510" y="150" text-anchor="middle">6</text>
