<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="A line part that ends on a known junction is reversed to start there">
  <style>
    .t { fill: #7d8697; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r { fill: #d64545; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm { font-size: 11px; }
    .h { font-weight: 600; }
    .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .s { stroke: #7d8697; }
    .g { stroke: #8b93a1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d6f"/></marker>
  </defs>
  <polyline points="60,160 170,120 290,140" fill="none" stroke="#8b93a1" stroke-width="2.5"/>
  <polygon points="118.3,138.8 112.9,144.5 110.5,137.9" fill="#8b93a1"/>
  <polygon points="233.5,130.6 226,132.9 227.1,126" fill="#8b93a1"/>
  <polyline points="290,140 380,96 480,52" fill="none" stroke="#2a9d6f" stroke-width="2.5"/>
  <polygon points="338.1,116.5 333.4,122.7 330.3,116.4" fill="#2a9d6f"/>
  <polygon points="433.2,72.6 428.2,78.6 425.4,72.2" fill="#2a9d6f"/>
  <circle cx="60" cy="160" r="5" fill="#8b93a1"/>
  <circle cx="170" cy="120" r="5" fill="#8b93a1"/>
  <circle cx="290" cy="140" r="6" fill="#8a63d2"/>
  <circle cx="380" cy="96" r="6" fill="#3b82c4"/>
  <circle cx="480" cy="52" r="6" fill="#3b82c4"/>
  <text class="t m" x="60" y="180" text-anchor="middle">a</text>
  <text class="t m" x="170" y="108" text-anchor="middle">b</text>
  <text class="t m" x="290" y="162" text-anchor="middle">c</text>
  <text class="t m" x="384" y="118" text-anchor="middle">e</text>
  <text class="t m" x="494" y="56">d</text>
  <text class="t" x="110" y="196">P1 (decoded): a → b → c</text>
  <text class="t" x="330" y="180">P2 stored: d → e → c</text>
  <text class="t" x="330" y="198" fill="#2a9d6f">P2 written: c → e → d</text>
  <rect x="30" y="20" width="190" height="30" rx="4" fill="none" stroke="#8b93a1" stroke-width="1.5"/>
  <text class="t m" x="125" y="40" text-anchor="middle">dictionary {a, b, c}</text>
  <text class="t sm" x="30" y="232">c: entry = 1, index of c  ·  e: residual  ·  d: exit = 0, residual</text>
</svg>
