  <text class="t" x="596" y="112" text-anchor="middle">byte width</text>
  <text class="t sm m" x="596" y="128" text-anchor="middle" fill="#8a63d2">0011 = escape</text>
  <line x1="130" y1="92" x2="130" y2="142" stroke="#8b93a1" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="t" x="130" y="158" text-anchor="middle">residual map</text>
  <text class="t sm m" x="130" y="174" text-anchor="middle" fill="#8b93a1">0 = zigzag</text>
  <line x1="274" y1="92" x2="274" y2="142" stroke="#8b93a1" stroke-width="1" stroke-dasharray="2 3"/>
