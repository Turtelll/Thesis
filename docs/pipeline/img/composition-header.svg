  <text class="t sm m" x="274" y="174" text-anchor="middle" fill="#e07b1a">001</text>
  <line x1="506" y1="92" x2="506" y2="142" stroke="#8b93a1" stroke-width="1" stroke-dasharray="2 3"/>
  <text class="t" x="506" y="158" text-anchor="middle">predictor, bit 3</text>
  <text class="t sm m" x="506" y="174" text-anchor="middle" fill="#e07b1a">0</text>
  <text class="t" x="40" y="214">predictor code = bit 3 · 8 + bits 2–0 = 0 · 8 + 1 = 1 → QUAD_CORNER</text>
