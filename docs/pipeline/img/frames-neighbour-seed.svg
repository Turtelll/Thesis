<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="A new ring takes its first frame from the nearest decoded ring">
  <style>
    .t { fill: #7d8697; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r { fill: #d64545; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm { font-size: 11px; }
    .h { font-weight: 600; }
    .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .s { stroke: #7d8697; }
    .g { stroke: #8b93a1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d6f"/></marker>
  </defs>
  <polygon points="86.9,40.1 156.1,80.1 133.1,119.9 63.9,79.9" fill="#8b93a1" fill-opacity="0.12" stroke="#8b93a1" stroke-width="1.5"/>
  <circle cx="110" cy="80" r="3" fill="#8b93a1"/>
  <text class="t sm" x="110" y="120" text-anchor="middle">30°</text>
  <polygon points="98.3,159.3 166.1,201.7 141.7,240.7 73.9,198.3" fill="#8b93a1" fill-opacity="0.12" stroke="#8b93a1" stroke-width="1.5"/>
  <circle cx="120" cy="200" r="3" fill="#8b93a1"/>
  <text class="t sm" x="120" y="240" text-anchor="middle">32°</text>
  <polygon points="411.9,25.4 432.6,102.7 388.1,114.6 367.4,37.3" fill="#8b93a1" fill-opacity="0.12" stroke="#8b93a1" stroke-width="1.5"/>
  <circle cx="400" cy="70" r="3" fill="#8b93a1"/>
  <text class="t sm" x="400" y="110" text-anchor="middle">75°</text>
  <text class="t h" x="30" y="26">decoded rings, each with its frame</text>
  <line x1="262.1" y1="181.1" x2="125.9" y2="199.2" stroke="#8b93a1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t sm" x="195" y="176" text-anchor="middle">nearest centroid</text>
  <line x1="263.2" y1="175.8" x2="115.1" y2="83.2" stroke="#8b93a1" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.6"/>
  <line x1="276.1" y1="174.8" x2="395.4" y2="73.9" stroke="#8b93a1" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.6"/>
  <polygon points="270,180 347.1,226.4 321.4,269.2 244.2,222.9" fill="none" stroke="#8a63d2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="270" y1="180" x2="320.9" y2="211.8" stroke="#8a63d2" stroke-width="2"/>
  <line x1="270" y1="180" x2="291.2" y2="146.1" stroke="#8a63d2" stroke-width="2"/>
  <circle cx="270" cy="180" r="6" fill="#8a63d2"/>
  <text class="t sm" x="278" y="150" text-anchor="start" fill="#8a63d2">seed frame 32°</text>
  <text class="t sm" x="260" y="206" text-anchor="end">first vertex</text>
  <text class="t sm" x="30" y="270">The neighbour's frame counts as one wall 50 units long; every decoded edge of the</text>
  <text class="t sm" x="30" y="286">new ring then adds its own vote, weighted by its length.</text>
</svg>
