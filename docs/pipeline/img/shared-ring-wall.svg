<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-label="Two row houses share a wall; ring B refers back to ring A">
  <style>
    .t { fill: #7d8697; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .r { fill: #d64545; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
    .sm { font-size: 11px; }
    .h { font-weight: 600; }
    .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .s { stroke: #7d8697; }
    .g { stroke: #8b93a1; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d64545"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b93a1"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82c4"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d6f"/></marker>
  </defs>
  <polygon points="60,60 180,60 180,170 60,170" fill="#8b93a1" fill-opacity="0.12" stroke="#8b93a1" stroke-width="1.5"/>
  <polygon points="180,170 180,60 300,60 300,170" fill="#3b82c4" fill-opacity="0.08" stroke="#3b82c4" stroke-width="1.5"/>
  <line x1="180" y1="60" x2="180" y2="170" stroke="#8a63d2" stroke-width="8" stroke-opacity="0.35"/>
  <text class="t" x="120" y="120" text-anchor="middle">A (decoded)</text>
  <text class="t" x="240" y="120" text-anchor="middle">B</text>
  <line x1="166" y1="80" x2="166" y2="150" stroke="#8b93a1" stroke-width="1.5" marker-end="url(#ag)"/>
  <line x1="194" y1="150" x2="194" y2="80" stroke="#3b82c4" stroke-width="1.5" marker-end="url(#ab)"/>
  <circle cx="60" cy="60" r="5" fill="#8b93a1"/>
  <circle cx="180" cy="60" r="5" fill="#8b93a1"/>
  <circle cx="180" cy="170" r="5" fill="#8b93a1"/>
  <circle cx="60" cy="170" r="5" fill="#8b93a1"/>
  <text class="t sm" x="52" y="54" text-anchor="end">a0</text>
  <text class="t sm" x="172" y="50" text-anchor="end">a1 = b1</text>
  <text class="t sm" x="172" y="188" text-anchor="end">a2 = b0</text>
  <text class="t sm" x="52" y="188" text-anchor="end">a3</text>
  <circle cx="180" cy="170" r="6" fill="#8a63d2"/>
  <circle cx="180" cy="60" r="6" fill="#3b82c4"/>
  <circle cx="300" cy="60" r="6" fill="#3b82c4"/>
  <circle cx="300" cy="170" r="6" fill="#e07b1a"/>
  <text class="t sm" x="308" y="54">b2</text>
  <text class="t sm" x="308" y="188">b3</text>
  <text class="t h" x="340" y="52">B is rotated to start at a2 and written as</text>
  <circle cx="348" cy="80" r="6" fill="#8a63d2"/>
  <text class="t m" x="362" y="84">b0</text>
  <text class="t" x="392" y="84">entry = 1, index of a2</text>
  <circle cx="348" cy="108" r="6" fill="#3b82c4"/>
  <text class="t m" x="362" y="112">b1</text>
  <text class="t" x="392" y="112">follow = 1, no residual</text>
  <circle cx="348" cy="136" r="6" fill="#3b82c4"/>
  <text class="t m" x="362" y="140">b2</text>
  <text class="t" x="392" y="140">residual</text>
  <circle cx="348" cy="164" r="6" fill="#e07b1a"/>
  <text class="t m" x="362" y="168">b3</text>
  <text class="t" x="392" y="168">corner residual</text>
  <text class="t sm" x="340" y="214">Same winding, so the shared wall runs the</text>
  <text class="t sm" x="340" y="230">other way in B: a2 → a1.</text>
</svg>
