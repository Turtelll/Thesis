  <text class="t m" x="610" y="240.5" text-anchor="middle">00</text>
  <text class="t sm" x="610" y="266" text-anchor="middle">0</text>
  <text class="t sm" x="30" y="290">FF marks a value too large for one byte; 145 = 400 − 255 follows as its exception.</text>
