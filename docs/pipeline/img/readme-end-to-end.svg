  <rect x="552" y="222" width="36" height="28" rx="4" fill="#e07b1a" fill-opacity="0.15" stroke="#e07b1a" stroke-width="1.5"/>
  <text class="t m" x="570" y="240.5" text-anchor="middle">00</text>
