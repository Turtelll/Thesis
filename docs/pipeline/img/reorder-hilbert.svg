    .sm { font-size: 11px; }
    .h { font-weight: 600; }
    .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .s { stroke: #7d8697; }
    .g { stroke: #8b93a1; }
  </style>
  <defs>
