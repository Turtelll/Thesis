plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.ecc.no/releases'
    }
}

/* Brotli4j's encoder is a per-platform native library; Maven selects it through profiles, Gradle
 * has to be told which one. */
def brotliPlatform = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'aarch64' : 'x86_64'
    if (os.contains('win')) {
        return "windows-${arch}"
    }
    if (os.contains('mac')) {
        return "osx-${arch}"
    }
    return "linux-${arch}"
}()

dependencies {
    implementation('org.maplibre:mlt')
    implementation('com.aayushatharva.brotli4j:brotli4j:1.23.0')
    runtimeOnly("com.aayushatharva.brotli4j:native-${brotliPlatform}:1.23.0")
    implementation('com.github.luben:zstd-jni:1.5.7-22')
    implementation('org.imintel:mbtiles4j:1.0.6')
    implementation('org.xerial:sqlite-jdbc:3.51.2.0')
    implementation('org.locationtech.jts:jts-core:1.20.0')
    implementation('com.google.code.gson:gson:2.13.2')
    implementation('org.apache.commons:commons-compress:1.28.0')

    testImplementation('org.junit.jupiter:junit-jupiter-api:6.0.3')
    testImplementation('org.junit.jupiter:junit-jupiter-params:6.0.3')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:6.0.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:6.0.3')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = findProperty('mainClass') ?: 'org.maplibre.mlt.research.cli.ExtractCli'
}

/* The benchmark is the everyday command, so it gets its own task rather than a -PmainClass
 * incantation: ./gradlew benchmark --args="../data/extracted" */
tasks.register('benchmark', JavaExec) {
    group = 'application'
    description = 'Baselines vs candidate encodings, compressed per tile with gzip/Brotli/zstd.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.cli.BenchmarkCli'
}

/* Charts (SVG) from a benchmark CSV: ./gradlew chart --args="../data/out/wins-check.csv" */
tasks.register('chart', JavaExec) {
    group = 'application'
    description = 'Renders SVG charts (totals, by layer, by zoom) from a benchmark --csv file.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.cli.ChartCli'
}

/* Prediction workshop: ./gradlew workshop --args="--layer building --by-zoom" */
tasks.register('workshop', JavaExec) {
    group = 'application'
    description = 'Workshop predictors interleaved over Varint: mean x/y residual size, Varint and per-tile gzip bytes vs baselines.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.cli.WorkshopCli'
}

