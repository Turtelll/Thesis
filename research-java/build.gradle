plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.ecc.no/releases'
    }
}

dependencies {
    implementation('org.maplibre:mlt')
    implementation('org.imintel:mbtiles4j:1.0.6')
    implementation('org.xerial:sqlite-jdbc:3.51.2.0')
    implementation('org.locationtech.jts:jts-core:1.20.0')
    implementation('com.google.code.gson:gson:2.13.2')
    implementation('org.apache.commons:commons-compress:1.28.0')

    testImplementation('org.junit.jupiter:junit-jupiter-api:6.0.3')
    testImplementation('org.junit.jupiter:junit-jupiter-params:6.0.3')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:6.0.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:6.0.3')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = findProperty('mainClass') ?: 'org.maplibre.mlt.research.extraction.ExtractCli'
}

/* The benchmark is the everyday command, so it gets its own task rather than a -PmainClass
 * incantation: ./gradlew benchmark --args="../data/extracted" */
tasks.register('benchmark', JavaExec) {
    group = 'application'
    description = 'Encodes every extracted VertexBuffer with every registered encoding.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.BenchmarkCli'
}

/* Prior measurement (encodes nothing): ./gradlew ringPrior --args="../data/extracted" */
tasks.register('ringPrior', JavaExec) {
    group = 'application'
    description = 'Measures predictor residual bit widths on >4-vertex polygon rings.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.RingPriorCli'
}

/* Geometry characterization (encodes nothing): ./gradlew buildingShape --args="../data/extracted" */
tasks.register('buildingShape', JavaExec) {
    group = 'application'
    description = 'Characterizes geometric properties of >4-vertex building polygon rings.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.BuildingShapeCli'
}

/* WP7 cost-model estimate (encodes nothing beyond SEGMENT_QUAD_CORNER, no new codec): */
/* ./gradlew entropy --args="../data/extracted --layer building" */
tasks.register('entropy', JavaExec) {
    group = 'application'
    description = 'Order-0 entropy estimate for SEGMENT_QUAD_CORNER residual regions vs FastPFOR bytes.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.EntropyCli'
}

/* ./gradlew condEntropy --args="../data/extracted --layer building" */
tasks.register('condEntropy', JavaExec) {
    group = 'application'
    description = 'Conditional-entropy probe: y|x, bucket/raw split, order-1 bucket context.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.CondEntropyCli'
}

/* ./gradlew decodeTime --args="../data/extractedBaseline --layer building" */
tasks.register('decodeTime', JavaExec) {
    group = 'application'
    description = 'Decode-time probe: rANS vs FastPFOR, interleaved vs segmented.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.DecodeTimeCli'
}

/* ./gradlew shareTable --args="../data/extractedBaseline" */
tasks.register('shareTable', JavaExec) {
    group = 'application'
    description = 'Probe: rANS frequency tables shared across buffers vs per-buffer.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.ShareTableCli'
}

/* ./gradlew featureBoundary --args="../data/extracted" */
tasks.register('featureBoundary', JavaExec) {
    group = 'application'
    description = 'Measures what the continuous delta cursor pays at feature/run boundaries.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.FeatureBoundaryCli'
}

/* Stage 0 protocol probe (encodes nothing): ./gradlew quadCornerResidual --args="../data/extracted --layer landcover" */
tasks.register('quadCornerResidual', JavaExec) {
    group = 'application'
    description = 'Stage 0 probe: second-order corner predictors on non-parallelogram 4-vertex rings.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.QuadCornerResidualCli'
}

/* Stage 0 protocol probe (encodes nothing): ./gradlew turnRadius --args="../data/extractedBaseline --layer transportation" */
tasks.register('turnRadius', JavaExec) {
    group = 'application'
    description = 'Stage 0 probe: per-zoom turn radius, curvature and line-predictor residuals.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.TurnRadiusCli'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = true
    }
}
