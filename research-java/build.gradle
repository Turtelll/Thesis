plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.ecc.no/releases'
    }
}

/* Brotli4j's encoder is a per-platform native library; Maven selects it through profiles, Gradle
 * has to be told which one. */
def brotliPlatform = {
    def os = System.getProperty('os.name').toLowerCase()
    def arch = System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'aarch64' : 'x86_64'
    if (os.contains('win')) {
        return "windows-${arch}"
    }
    if (os.contains('mac')) {
        return "osx-${arch}"
    }
    return "linux-${arch}"
}()

dependencies {
    implementation('org.maplibre:mlt')
    implementation('com.aayushatharva.brotli4j:brotli4j:1.23.0')
    runtimeOnly("com.aayushatharva.brotli4j:native-${brotliPlatform}:1.23.0")
    implementation('com.github.luben:zstd-jni:1.5.7-22')
    implementation('org.imintel:mbtiles4j:1.0.6')
    implementation('org.xerial:sqlite-jdbc:3.51.2.0')
    implementation('org.locationtech.jts:jts-core:1.20.0')
    implementation('com.google.code.gson:gson:2.13.2')
    implementation('org.apache.commons:commons-compress:1.28.0')

    testImplementation('org.junit.jupiter:junit-jupiter-api:6.0.3')
    testImplementation('org.junit.jupiter:junit-jupiter-params:6.0.3')
    testImplementation('com.tngtech.archunit:archunit:1.4.1')
    testImplementation('net.jqwik:jqwik:1.9.3')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:6.0.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:6.0.3')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'org.maplibre.mlt.research.cli.Research'
}

/* The one entry point of the research code (docs/consolidation-inventory.md):
 *   ./gradlew research --args="measure --step s8 --by-zoom"
 *   ./gradlew research --args="<command> ..."   (no arguments lists the commands)
 * `./gradlew run --args="extract --mbtiles ..."` is the same main. */
tasks.register('research', JavaExec) {
    group = 'application'
    description = 'Runs one research command (extract, measure, dump, workshop, ...); no arguments lists them.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.maplibre.mlt.research.cli.Research'
    jvmArgs = ['-Xmx6g']
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showStandardStreams = true
    }
}