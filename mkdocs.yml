site_name: MLT vertex-buffer encoding
site_url: https://turtelll.github.io/Thesis/
repo_url: https://github.com/Turtelll/Thesis
repo_name: Turtelll/Thesis
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
