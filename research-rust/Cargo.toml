[workspace]
resolver = "3"
members = ["mlt-pipeline", "mlt-core-pipeline", "mlt-tile-oracle", "mlt-oracle", "mlt-cli-pipeline"]

[workspace.package]
authors = ["Maplibre Contributors"]
categories = ["science::geo"]
edition = "2024"
homepage = "https://maplibre.org"
keywords = ["maplibre", "tile", "mlt", "mvt", "map"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/maplibre/maplibre-tile-spec"
rust-version = "1.98"

# The dependency table of maplibre-tile-spec/rust/Cargo.toml (the pinned commit), reproduced for the
# copy of mlt-core in ./mlt-core-pipeline. Only what mlt-core, the codec and the oracle need.
[workspace.dependencies]
anyhow = "1"
arbitrary = { version = "1.4", features = ["derive"] }
bitvec = "1"
bytemuck = "1.25.0"
bytes = "1"
clap = { version = "4.6.0", features = ["derive"] }
compact_str = "0.10.0"
crossbeam-channel = "0.5"
crossterm = "0.29.0"
derive-debug = "0.1.2"
enum_dispatch = "0.3"
fast-mvt = "0.7.0"
fastpfor = { version = "0.9", features = ["rust"] }
flate2 = "1"
fsst-rs = "0.6"
futures = "0.3"
geo = { version = "0.33.1", default-features = false }
geo-types = "0.7.19"
geojson = { version = "1", default-features = false }
glob = "0.3"
globset = "0.4"
hex = "0.4.3"
hilbert_2d = "1.1.0"
hotpath = "0.29.0"
indicatif = "0.18"
integer-encoding = "4.0.2"
martin-tile-utils = "0.9"
mbtiles = { version = "0.21", default-features = false, features = ["transcode"] }
mimalloc = "0.1.52"
moka = { version = "0.12", features = ["sync"] }
num-traits = "0.2.19"
num_enum = "0.7.6"
pmtiles = { version = "0.25.0", default-features = false, features = ["mmap-async-tokio", "write", "tilejson", "iter-async", "brotli", "zstd"] }
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
rayon = "1"
rstar = "0.13"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
size_format = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tabled = { version = "0.22", default-features = false, features = ["std", "derive"] }
thiserror = "2.0.11"
thousands = "0.2"
tilejson = "0.4"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
toml = "1"
union-find = "0.4.4"
usize_cast = "1.1.0"
walkdir = "2"
wide = "1.5.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zigzag = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[profile.release]
debug = false
lto = "thin"
codegen-units = 4
